<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة الطلاب اليومي الذكي - Firebase</title>

    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Tajawal', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            .print-area { width: 100% !important; margin: 0 !important; padding: 0 !important; }
            @page { size: A4 landscape; margin: 0.8cm; }
            body { background: white; }
            table { border-collapse: collapse !important; width: 100% !important; }
            th, td { border: 1px solid #000 !important; padding: 4px !important; font-size: 11px !important; text-align: center; }
            select, input { border: none !important; appearance: none; -webkit-appearance: none; background: transparent !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <div class="max-w-7xl mx-auto p-4 md:p-6 print-area">
        
        <!-- الهيدر وعنوان التطبيق -->
        <header class="bg-white rounded-xl shadow-md p-5 mb-6 no-print border-r-4 border-indigo-600">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-user-check text-indigo-600"></i> نظام متابعة الطلاب اليومي المتقدم
                    </h1>
                    <p class="text-slate-500 text-sm mt-1">مزامنة فورية مع قاعدة البيانات السحابية (Firebase)</p>
                </div>
                
                <div class="flex items-center gap-3">
                    <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-print"></i> طباعة السجل اليومي
                    </button>
                    <button onclick="saveTodayRecords()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-cloud-arrow-up"></i> حفظ السجل بالسحابة
                    </button>
                </div>
            </div>
        </header>

        <!-- أدوات التحكم والبحث المتقدم -->
        <section class="bg-white rounded-xl shadow-md p-5 mb-6 no-print border border-slate-200">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">التاريخ اليومي</label>
                    <input type="date" id="selectedDate" onchange="loadRecordsForDate()" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">الصف / الشعبة</label>
                    <input type="text" id="className" value="الصف العاشر - أ" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">المادة الدراسية</label>
                    <input type="text" id="subjectName" value="اللغة الإنجليزية" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">إضافة طالب جديد</label>
                    <div class="flex gap-2">
                        <input type="text" id="newStudentName" placeholder="اسم الطالب الثلاثي" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        <button onclick="addNewStudent()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-lg text-sm transition">إضافة</button>
                    </div>
                </div>
            </div>

            <!-- شريط البحث السريع والبحث الصوتي والـ Bulk Search -->
            <div class="pt-3 border-t border-slate-100 flex flex-col md:flex-row gap-3 items-center justify-between">
                <div class="relative w-full md:w-2/3 flex items-center gap-2">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute right-3 top-3 text-slate-400"></i>
                        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="ابحث عن اسم أو عدة أسماء تفصل بينها مسافة أو فاصلة..." class="w-full pl-3 pr-10 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-slate-50">
                    </div>
                    
                    <!-- زر البحث الصوتي -->
                    <button id="voiceBtn" onclick="startVoiceSearch()" title="البحث الصوتي" class="bg-slate-200 hover:bg-indigo-100 hover:text-indigo-600 text-slate-700 p-2.5 rounded-lg transition flex items-center justify-center">
                        <i class="fa-solid fa-microphone"></i>
                    </button>

                    <!-- زر تصفية النتائج -->
                    <button onclick="clearSearchFilter()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1 border border-rose-200">
                        <i class="fa-solid fa-filter-circle-xmark"></i> تصفية
                    </button>
                </div>

                <div class="text-xs text-slate-500 flex items-center gap-2">
                    <span id="syncStatus" class="inline-flex items-center gap-1 text-emerald-600 font-semibold">
                        <i class="fa-solid fa-circle-check"></i> متصل بالسحابة
                    </span>
                    <span>|</span>
                    <span>عدد الطلاب: <strong id="studentCount">0</strong></span>
                </div>
            </div>
        </section>

        <!-- الجدول الرئيسي للطباعة والعرض -->
        <main class="bg-white rounded-xl shadow-md p-5 border border-slate-200">
            <!-- ترويسة متغيرة أثناء الطباعة -->
            <div class="hidden print:block text-center mb-4">
                <h2 class="text-xl font-bold">سجل متابعة الطلاب اليومي</h2>
                <div class="flex justify-between text-xs mt-2 border-b pb-2">
                    <span>التاريخ: <strong id="printDate"></strong></span>
                    <span>الصف: <strong id="printClass"></strong></span>
                    <span>المادة: <strong id="printSubject"></strong></span>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-sm text-right">
                    <thead class="bg-slate-100 text-slate-700 font-bold border-b border-slate-300">
                        <tr>
                            <th class="p-2 text-center w-12">#</th>
                            <th class="p-2 w-48">اسم الطالب</th>
                            <th class="p-2 text-center">الغياب والتأخير</th>
                            <th class="p-2 text-center">إنجاز الواجب</th>
                            <th class="p-2 text-center">إحضار الكتب/الدفتر</th>
                            <th class="p-2 text-center">السلوك والأدب</th>
                            <th class="p-2 text-center">المشاركة</th>
                            <th class="p-2 w-40">ملاحظات</th>
                            <th class="p-2 text-center no-print w-16">إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody">
                        <!-- يتم جلب أسطر الطلاب ديناميكياً هنا -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات مشروع Firebase الخاص بك
        const firebaseConfig = {
            apiKey: "AIzaSyCCgKVKcqmndmerSon5pLGTbbVCZ5CgumE",
            authDomain: "souknav.firebaseapp.com",
            projectId: "souknav",
            storageBucket: "souknav.firebasestorage.app",
            messagingSenderId: "464271285756",
            appId: "1:464271285756:web:66b68e244fe32ba8566679"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // متغيرات البيانات العامة
        let studentsList = JSON.parse(localStorage.getItem('studentsList')) || [
            { id: '1', name: 'أحمد محمود العبد' },
            { id: '2', name: 'محمد خالد الشطي' },
            { id: '3', name: 'عبدالله يوسف علي' }
        ];

        let dailyRecords = {};

        // ضبط تاريخ اليوم تلقائياً
        const dateInput = document.getElementById('selectedDate');
        dateInput.value = new Date().toISOString().split('T')[0];

        // تهيئة النظام
        window.addEventListener('DOMContentLoaded', () => {
            renderStudentsTable();
            loadRecordsForDate();
        });

        // رندر جدول الطلاب مع مرونة التصفية والبحث
        window.renderStudentsTable = function() {
            const tbody = document.getElementById('studentsTableBody');
            const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
            tbody.innerHTML = '';

            // كود البحث المتعدد (Bulk search logic)
            const searchTerms = searchVal.split(/[\s,]+/).filter(t => t.length > 0);

            const filteredStudents = studentsList.filter(student => {
                if (searchTerms.length === 0) return true;
                return searchTerms.some(term => student.name.toLowerCase().includes(term));
            });

            document.getElementById('studentCount').innerText = filteredStudents.length;

            filteredStudents.forEach((student, index) => {
                const rec = dailyRecords[student.id] || { attendance: 'حاضر', homework: 'مكتمل', books: 'كاملة', behavior: 'مؤدب', participation: 'ممتاز', notes: '' };

                const tr = document.createElement('tr');
                tr.className = "border-b border-slate-200 hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="p-2 text-center font-bold text-slate-500">${index + 1}</td>
                    <td class="p-2 font-bold text-slate-800">${student.name}</td>
                    
                    <!-- الحضور والغياب -->
                    <td class="p-2 text-center">
                        <select onchange="updateRecord('${student.id}', 'attendance', this.value)" class="border rounded px-2 py-1 text-xs bg-white focus:ring-1 focus:ring-indigo-500">
                            <option value="حاضر" ${rec.attendance === 'حاضر' ? 'selected' : ''}>حاضر</option>
                            <option value="غائب" ${rec.attendance === 'غائب' ? 'selected' : ''}>غائب</option>
                            <option value="متأخر" ${rec.attendance === 'متأخر' ? 'selected' : ''}>متأخر</option>
                        </select>
                    </td>

                    <!-- الواجب المدرسى -->
                    <td class="p-2 text-center">
                        <select onchange="updateRecord('${student.id}', 'homework', this.value)" class="border rounded px-2 py-1 text-xs bg-white focus:ring-1 focus:ring-indigo-500">
                            <option value="مكتمل" ${rec.homework === 'مكتمل' ? 'selected' : ''}>أكمله (كامل)</option>
                            <option value="جزئي" ${rec.homework === 'جزئي' ? 'selected' : ''}>أكمله (جزئي)</option>
                            <option value="لم يكمل" ${rec.homework === 'لم يكمل' ? 'selected' : ''}>لم يكمله</option>
                        </select>
                    </td>

                    <!-- الكتب والدفاتر -->
                    <td class="p-2 text-center">
                        <select onchange="updateRecord('${student.id}', 'books', this.value)" class="border rounded px-2 py-1 text-xs bg-white focus:ring-1 focus:ring-indigo-500">
                            <option value="كاملة" ${rec.books === 'كاملة' ? 'selected' : ''}>أحضر كل الكتب</option>
                            <option value="بدون كتاب الطالب" ${rec.books === 'بدون كتاب الطالب' ? 'selected' : ''}>لم يحضر كتاب الطالب</option>
                            <option value="بدون كتاب التمارين" ${rec.books === 'بدون كتاب التمارين' ? 'selected' : ''}>لم يحضر كتاب التمارين</option>
                            <option value="بدون الدفتر" ${rec.books === 'بدون الدفتر' ? 'selected' : ''}>لم يحضر الدفتر</option>
                            <option value="بدون الكتاب والدفتر" ${rec.books === 'بدون الكتاب والدفتر' ? 'selected' : ''}>لم يحضر الكتاب والدفتر</option>
                        </select>
                    </td>

                    <!-- السلوك والأدب -->
                    <td class="p-2 text-center">
                        <select onchange="updateRecord('${student.id}', 'behavior', this.value)" class="border rounded px-2 py-1 text-xs bg-white focus:ring-1 focus:ring-indigo-500">
                            <option value="مؤدب" ${rec.behavior === 'مؤدب' ? 'selected' : ''}>ممتاز ومؤدب</option>
                            <option value="كثير الحركة" ${rec.behavior === 'كثير الحركة' ? 'selected' : ''}>كثير الحركة</option>
                            <option value="مشاغب" ${rec.behavior === 'مشاغب' ? 'selected' : ''}>مشاغب</option>
                            <option value="غير متعاون" ${rec.behavior === 'غير متعاون' ? 'selected' : ''}>غير متعاون</option>
                        </select>
                    </td>

                    <!-- المشاركة -->
                    <td class="p-2 text-center">
                        <select onchange="updateRecord('${student.id}', 'participation', this.value)" class="border rounded px-2 py-1 text-xs bg-white focus:ring-1 focus:ring-indigo-500">
                            <option value="ممتاز" ${rec.participation === 'ممتاز' ? 'selected' : ''}>ممتاز</option>
                            <option value="جيد" ${rec.participation === 'جيد' ? 'selected' : ''}>جيد</option>
                            <option value="ضعيف" ${rec.participation === 'ضعيف' ? 'selected' : ''}>ضعيف</option>
                        </select>
                    </td>

                    <!-- ملاحظات -->
                    <td class="p-2">
                        <input type="text" value="${rec.notes || ''}" onchange="updateRecord('${student.id}', 'notes', this.value)" placeholder="ملاحظة..." class="w-full border rounded px-2 py-1 text-xs outline-none focus:ring-1 focus:ring-indigo-500">
                    </td>

                    <td class="p-2 text-center no-print">
                        <button onclick="removeStudent('${student.id}')" class="text-rose-500 hover:text-rose-700 transition"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        };

        // إدارة السجلات الحالية والبحث الفوري
        window.handleSearch = function() {
            renderStudentsTable();
        };

        window.clearSearchFilter = function() {
            document.getElementById('searchInput').value = '';
            renderStudentsTable();
        };

        // دعم ميزة التعرف على الصوت للبحث (Voice-to-text)
        window.startVoiceSearch = function() {
            const voiceBtn = document.getElementById('voiceBtn');
            const searchInput = document.getElementById('searchInput');

            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('عذراً، ميزة التحدث غير مدعومة في هذا المتصفح. يفضل استخدام متصفح Chrome.');
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();

            recognition.lang = 'ar-JO'; // اللغة العربية
            recognition.interimResults = false;

            recognition.onstart = function() {
                voiceBtn.classList.add('bg-rose-500', 'text-white', 'animate-pulse');
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                // عند إدخال الصوت يتم إضافته لخانة البحث مع الملاحظة التراكمية
                if (searchInput.value.trim() !== '') {
                    searchInput.value += " " + transcript;
                } else {
                    searchInput.value = transcript;
                }
                renderStudentsTable();
            };

            recognition.onerror = function() {
                alert('تعذر التقاط الصوت، يرجى المحاولة مرة أخرى.');
            };

            recognition.onend = function() {
                voiceBtn.classList.remove('bg-rose-500', 'text-white', 'animate-pulse');
            };

            recognition.start();
        };

        // تحديث قيم السجلات
        window.updateRecord = function(studentId, field, value) {
            if (!dailyRecords[studentId]) {
                dailyRecords[studentId] = {};
            }
            dailyRecords[studentId][field] = value;
        };

        // إضافة طالب جديد
        window.addNewStudent = function() {
            const input = document.getElementById('newStudentName');
            const name = input.value.trim();
            if (name) {
                const newStudent = { id: Date.now().toString(), name: name };
                studentsList.push(newStudent);
                localStorage.setItem('studentsList', JSON.stringify(studentsList));
                input.value = '';
                renderStudentsTable();
            }
        };

        // حذف طالب
        window.removeStudent = function(id) {
            if (confirm('هل أنت تأكد من حذف هذا الطالب؟')) {
                studentsList = studentsList.filter(s => s.id !== id);
                localStorage.setItem('studentsList', JSON.stringify(studentsList));
                renderStudentsTable();
            }
        };

        // حفظ البيانات في قاعدة بيانات Firebase Firestore
        window.saveTodayRecords = async function() {
            const currentDate = document.getElementById('selectedDate').value;
            const className = document.getElementById('className').value;
            const subjectName = document.getElementById('subjectName').value;

            try {
                await setDoc(doc(db, "daily_records", currentDate), {
                    date: currentDate,
                    class: className,
                    subject: subjectName,
                    records: dailyRecords,
                    updatedAt: new Date()
                });

                document.getElementById('syncStatus').innerHTML = `<i class="fa-solid fa-cloud-check text-emerald-600"></i> تم الحفظ في Firebase`;
                alert('تم حفظ السجل اليومي بنجاح في قاعدة البيانات Cloud Firestore!');
            } catch (e) {
                console.error("خطأ أثناء الحفظ:", e);
                alert('حدث خطأ أثناء الحفظ بالسحابة، تم الحفظ محلياً.');
            }
        };

        // تحميل السجلات الخاصة بتاريخ محدد من Firebase
        window.loadRecordsForDate = async function() {
            const currentDate = document.getElementById('selectedDate').value;
            document.getElementById('printDate').innerText = currentDate;
            document.getElementById('printClass').innerText = document.getElementById('className').value;
            document.getElementById('printSubject').innerText = document.getElementById('subjectName').value;

            try {
                const docRef = doc(db, "daily_records", currentDate);
                const docSnap = await getDocs(query(collection(db, "daily_records"), where("date", "==", currentDate)));

                dailyRecords = {};
                docSnap.forEach((d) => {
                    if (d.data() && d.data().records) {
                        dailyRecords = d.data().records;
                    }
                });

                renderStudentsTable();
            } catch (err) {
                console.log("استخدام البيانات المحلية:", err);
                renderStudentsTable();
            }
        };
    </script>
</body>
</html>
